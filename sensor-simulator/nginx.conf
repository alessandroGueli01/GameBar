worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;

        # Frontend static files (assuming it's built and copied here, or served by another container)
        # For now, we'll assume the frontend is served separately or via a dev server.
        # If you want Nginx to serve the frontend, you'd add:
        # root /usr/share/nginx/html;
        # index index.html index.htm;
        # try_files $uri $uri/ /index.html;

        # Proxy requests to User Service
        location /api/users/ {
            proxy_pass http://user-service:3001/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy requests to Game Service
        location /api/games/ {
            proxy_pass http://game-service:3002/api/games/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy requests to Match Service
        location /api/matches/ {
            proxy_pass http://match-service:3003/api/matches/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy requests to Tournament Service
        location /api/tournaments/ {
            proxy_pass http://tournament-service:3004/api/tournaments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy requests to Statistics Service
        location /api/stats/ {
            proxy_pass http://statistics-service:3005/api/stats/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}